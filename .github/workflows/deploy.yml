name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud CLI
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/evident-ratio-464001-i3/bridge-api/bridge-api:latest .
          docker push us-central1-docker.pkg.dev/evident-ratio-464001-i3/bridge-api/bridge-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bridge-api \
            --image us-central1-docker.pkg.dev/evident-ratio-464001-i3/bridge-api/bridge-api:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory=8Gi \
            --cpu=4 \
            --port=8080
